<!-- @dsCard group="Colors" viewport="820x190" subtitle="Categorical data-viz palette — ≥4.5:1 on navy" name="Data-viz palette" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-mono,'Space Mono',ui-monospace,monospace);background:var(--bg,#262a4f);padding:16px;display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sw{border-radius:6px;border:1px solid var(--line,#393d63);padding:10px 8px;display:flex;flex-direction:column;gap:24px;color:var(--on-accent,#262a4f)}
.sw b{font-size:10px;font-weight:400;letter-spacing:.04em}.sw i{font-style:normal;font-size:9px;opacity:.75}</style></head>
<body>
<div class="sw" style="background:var(--viz-amber,#E39A4D)"><b>--viz-amber</b><i>#E39A4D</i></div>
<div class="sw" style="background:var(--viz-red,#EA7267)"><b>--viz-red</b><i>#EA7267</i></div>
<div class="sw" style="background:var(--viz-teal,#52A8C4)"><b>--viz-teal</b><i>#52A8C4</i></div>
<div class="sw" style="background:var(--viz-blue,#6E9BE8)"><b>--viz-blue</b><i>#6E9BE8</i></div>
<div class="sw" style="background:var(--viz-green,#4FC17E)"><b>--viz-green</b><i>#4FC17E</i></div>
<div class="sw" style="background:var(--viz-purple,#A78BE0)"><b>--viz-purple</b><i>#A78BE0</i></div>
<div class="sw" style="background:var(--viz-brown,#C89B6A)"><b>--viz-brown</b><i>#C89B6A</i></div>
<div class="sw" style="background:var(--viz-grey,#9EA0C0)"><b>--viz-grey</b><i>#9EA0C0</i></div>
</body></html>
