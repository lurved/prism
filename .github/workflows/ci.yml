name: CI

# Merge gate for the ESG tracker (the typed, data-critical part of the site).
# Moves typecheck / lint / build from deploy-time (Vercel) to PR-time so a
# broken data shape can't reach a preview or production unnoticed.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  esg-tracker:
    name: esg-tracker (typecheck · lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sustainability/report_comparison
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sustainability/report_comparison/package-lock.json

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (data-integrity gate)
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Root site (Eleventy/Tina + Vercel serverless functions in /api, agent/,
  # middleware.js). Previously had ZERO CI coverage — a broken /api handler
  # or middleware.js only surfaced on the first real request in production.
  # This job is deliberately cheap (no type system here, it's plain JS): a
  # syntax check on every function plus the actual Eleventy build catches the
  # most common breakage (typos, bad requires, template errors) before merge.
  root-site:
    name: root-site (syntax check · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Syntax-check serverless functions & middleware
        run: |
          status=0
          for f in $(find api agent -name "*.js" -not -path "*/node_modules/*") middleware.js analytics.js chat-widget.js script.js; do
            node --check "$f" || status=1
          done
          exit $status

      - name: Build (Eleventy; Tina build is best-effort without cloud creds)
        run: npm run build
